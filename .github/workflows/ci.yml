name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # assembleRelease checks that the R8-minified demo build still builds.
      # verifyRoborazziDebug runs all unit tests and compares screenshots
      # with the references in app/src/test/screenshots.
      - name: Build, unit tests, screenshot tests and lint
        run: ./gradlew assembleDebug assembleRelease verifyRoborazziDebug lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
