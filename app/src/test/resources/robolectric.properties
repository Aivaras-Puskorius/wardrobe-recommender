# INFO(limit): Robolectric renders with Android 15 (SDK 35) because SDK 36 and 37 need Java 21
# and the build runs on JDK 17. Raise this when the build moves to JDK 21.
sdk=35
graphicsMode=NATIVE
# Tests build their own AppContainer. The app's WardrobeApplication would start ML Kit, which can't run here.
application=android.app.Application
